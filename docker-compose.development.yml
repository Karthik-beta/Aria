# Docker Compose Configuration for Development Environment 🛠️
# This configuration is optimized for local development with hot-reload and debugging 🔁

services:
  # Caddy reverse proxy (development mode) 🔧
  caddy:
    image: caddy:2.8-alpine
    container_name: aria-dev-caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '2680:2019' # Admin API (mapped to 2680 to avoid Windows port exclusion ranges)
    volumes:
      - ./deployment/caddy/Caddyfile.development:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - aria-dev-network
    depends_on:
      - frontend
      - backend
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Frontend (Next.js development server) ✨
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      target: development
    container_name: aria-dev-frontend
    restart: unless-stopped
    ports:
      - '3000:3000' # Exposed for direct access during dev
    volumes:
      # Mount app source code
      - ./apps/frontend:/app/apps/frontend

      # Mount source code for each package
      - ./packages/types:/app/packages/types
      - ./packages/utils:/app/packages/utils

      # Preserve node_modules in each package
      - /app/packages/types/node_modules
      - /app/packages/utils/node_modules
      # - /app/packages/config-eslint/node_modules
      # - /app/packages/config-typescript/node_modules

      # Preserve app-level and root node_modules
      - /app/apps/frontend/node_modules
      - /app/apps/frontend/.next
      - /app/node_modules
    environment:
      - NODE_ENV=development
      # Empty string forces browser to use relative URLs (same origin)
      # For browser WebSocket: ws://localhost/trpc-ws (proxied by Caddy)
      # See: https://trpc.io/docs/client/links/wsLink
      - NEXT_PUBLIC_API_URL=
      # Flag to disable Next.js rewrites in Docker (Caddy handles all proxying)
      - DOCKER=true
      - NEXT_TELEMETRY_DISABLED=1
      - WATCHPACK_POLLING=true
    networks:
      - aria-dev-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:3000/']
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: bun --filter frontend dev

  # Backend (NestJS development server) 🚀
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: development
    container_name: aria-dev-backend
    restart: unless-stopped
    ports:
      - '3001:3001' # Exposed for direct access during dev
      - '9229:9229' # Node.js debugger
    volumes:
      # Mount source files for hot reload
      - ./apps/backend/src:/app/apps/backend/src:cached
      - ./apps/backend/package.json:/app/apps/backend/package.json:ro
      - ./apps/backend/tsconfig.json:/app/apps/backend/tsconfig.json:ro

      # Mount source code for each package
      - ./packages/types:/app/packages/types:cached
      - ./packages/utils:/app/packages/utils:cached

      # Preserve node_modules in each package
      - /app/packages/types/node_modules
      - /app/packages/utils/node_modules

      # Preserve app-level and root node_modules
      - backend-node-modules:/app/apps/backend/node_modules
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://aria_dev:${POSTGRES_PASSWORD:-dev_password}@postgres:5432/aria_dev
      - REDIS_URL=redis://redis:6379
      - APP_TIME_ZONE=${APP_TIME_ZONE:-UTC}
      - ASSET_DEPRECIATION_QUEUE_CONCURRENCY=${ASSET_DEPRECIATION_QUEUE_CONCURRENCY:-5}
      - ASSET_DEPRECIATION_BARRIER_TIMEOUT_MS=${ASSET_DEPRECIATION_BARRIER_TIMEOUT_MS:-120000}
      - PORT=3001
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-dev_better_auth_secret_change_in_production}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3001}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - DEFAULT_ADMIN_USERNAME=admin
      - DEFAULT_ADMIN_PASSWORD=admin123
      - DEFAULT_ADMIN_EMAIL=admin@aria.local
      - DEFAULT_ADMIN_NAME=Administrator
    networks:
      - aria-dev-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:3001/health']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    command: bun --filter backend dev

  # PostgreSQL database 🐘
  postgres:
    image: postgres:18-alpine
    container_name: aria-dev-postgres
    restart: unless-stopped
    ports:
      - '5432:5432' # Exposed for database tools
    environment:
      - POSTGRES_DB=aria_dev
      - POSTGRES_USER=aria_dev
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-dev_password}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8
    volumes:
      - postgres-dev-data:/var/lib/postgresql
    networks:
      - aria-dev-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -d aria_dev -U aria_dev']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Redis (for caching and sessions) ⚡
  redis:
    image: redis:7-alpine
    container_name: aria-dev-redis
    restart: unless-stopped
    ports:
      - '6379:6379' # Exposed for Redis tools
    volumes:
      - redis-dev-data:/data
    networks:
      - aria-dev-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

volumes:
  postgres-dev-data:
    driver: local
  redis-dev-data:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local
  backend-node-modules:
    driver: local

networks:
  aria-dev-network:
    driver: bridge
    name: aria-dev-network
