# Docker Compose Configuration for Development Environment
# This configuration is optimized for local development with hot-reload and debugging

services:
  # Caddy reverse proxy (development mode)
  caddy:
    image: caddy:2.8-alpine
    container_name: aria-dev-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "2019:2019"  # Admin API
    volumes:
      - ./deployment/caddy/Caddyfile.development:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - aria-dev-network
    depends_on:
      - frontend
      - backend
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:2019/config/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Frontend (Next.js development server)
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      target: development
    container_name: aria-dev-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"  # Exposed for direct access during dev
    volumes:
      # Mount source code for hot reload
      - ./apps/frontend:/app/apps/frontend
      - ./packages:/app/packages
      - /app/apps/frontend/node_modules
      - /app/apps/frontend/.next
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost/api
      - NEXT_TELEMETRY_DISABLED=1
      - WATCHPACK_POLLING=true
    networks:
      - aria-dev-network
    depends_on:
      backend:
        condition: service_healthy
    command: pnpm dev

  # Backend (NestJS development server)
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: development
    container_name: aria-dev-backend
    restart: unless-stopped
    ports:
      - "3001:3001"  # Exposed for direct access during dev
      - "9229:9229"  # Node.js debugger
    volumes:
      # Mount source code for hot reload
      - ./apps/backend:/app/apps/backend
      - ./packages:/app/packages
      - /app/apps/backend/node_modules
      - /app/apps/backend/dist
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://aria_dev:${POSTGRES_PASSWORD:-dev_password}@postgres:5432/aria_dev
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:-dev_jwt_secret_change_in_production}
    networks:
      - aria-dev-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    command: pnpm dev

  # PostgreSQL database
  postgres:
    image: postgres:18-alpine
    container_name: aria-dev-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"  # Exposed for database tools
    environment:
      - POSTGRES_DB=aria_dev
      - POSTGRES_USER=aria_dev
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-dev_password}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    networks:
      - aria-dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d aria_dev -U aria_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Redis (for caching and sessions)
  redis:
    image: redis:7-alpine
    container_name: aria-dev-redis
    restart: unless-stopped
    ports:
      - "6379:6379"  # Exposed for Redis tools
    volumes:
      - redis-dev-data:/data
    networks:
      - aria-dev-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

volumes:
  postgres-dev-data:
    driver: local
  redis-dev-data:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local

networks:
  aria-dev-network:
    driver: bridge
    name: aria-dev-network
