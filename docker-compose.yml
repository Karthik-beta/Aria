services:
  traefik:
    image: traefik:v3.1
    command:
      - '--providers.docker=true'
      - '--providers.file.directory=/etc/traefik/dynamic'
      - '--providers.file.watch=true'
      - '--entrypoints.web.address=:80'
      - '--entrypoints.websecure.address=:443'
      - '--entrypoints.web.http.redirections.entrypoint.to=websecure'
      - '--entrypoints.web.http.redirections.entrypoint.scheme=https'
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - '/var/run/docker.sock:/var/run/docker.sock:ro'
      - './traefik/dynamic:/etc/traefik/dynamic:ro'
      - './traefik/certs:/etc/ssl/traefik:ro'

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aria
      POSTGRES_USER: aria
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aria}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -d aria -U aria']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://aria:${POSTGRES_PASSWORD:-aria}@postgres:5432/aria
    expose:
      - "3000"
    restart: unless-stopped

  asset:
    build:
      context: .
      dockerfile: apps/frontend/asset/Dockerfile
    profiles:
      - asset
      - full
    environment:
      DOCKER_ENV: "true"
    expose:
      - "3000"
    restart: unless-stopped
    
  hrms:
    build:
      context: .
      dockerfile: apps/frontend/hrms/Dockerfile
    profiles:
      - hrms
      - full
    environment:
      DOCKER_ENV: "true"
    expose:
      - "3000"
    restart: unless-stopped
    
  inventory:
    build:
      context: .
      dockerfile: apps/frontend/inventory/Dockerfile
    profiles:
      - inventory
      - full
    environment:
      DOCKER_ENV: "true"
    expose:
      - "3000"
    restart: unless-stopped
    
  crm:
    build:
      context: .
      dockerfile: apps/frontend/CRM/Dockerfile
    profiles:
      - crm
      - full
    environment:
      DOCKER_ENV: "true"
    expose:
      - "3000"
    restart: unless-stopped

volumes:
  postgres-data:
