# TLS Configuration for Static IP Deployments
# This file configures Traefik to use self-signed certificates for HTTPS

tls:
  certificates:
    - certFile: /etc/ssl/traefik/server.crt
      keyFile: /etc/ssl/traefik/server.key
      stores:
        - default

  # Default TLS store configuration
  stores:
    default:
      defaultCertificate:
        certFile: /etc/ssl/traefik/server.crt
        keyFile: /etc/ssl/traefik/server.key

  # TLS options for enhanced security
  options:
    default:
      minVersion: 'VersionTLS12'
      cipherSuites:
        - 'TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384'
        - 'TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305'
        - 'TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256'
        - 'TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA256'
      curvePreferences:
        - 'CurveP521'
        - 'CurveP384'
      sniStrict: false
