[req]
default_bits       = 4096
distinguished_name = req_distinguished_name
x509_extensions    = v3_req
prompt             = no

[req_distinguished_name]
C  = US
ST = State
L  = City
O  = Aria ERP
OU = Development
CN = localhost

[v3_req]
keyUsage = keyEncipherment, dataEncipherment
extendedKeyUsage = serverAuth
subjectAltName = @alt_names

[alt_names]
DNS.1 = localhost
DNS.2 = aria.local
DNS.3 = *.aria.local
DNS.4 = backend
DNS.5 = asset
DNS.6 = crm
DNS.7 = hrms
DNS.8 = inventory
IP.1  = 127.0.0.1
IP.2  = ::1
