name: Enforce Official Docs References

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  check-official-docs:
    name: Check PR for official-docs references
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node (used for a small script)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
