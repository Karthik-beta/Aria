# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CI_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aria?schema=public

on:
  push:
    branches: ['main', 'master']
  pull_request:
    branches: ['main', 'master']

jobs:
  install-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aria
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aria"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_CACHE: ${{ github.event_name == 'pull_request' && 'local:rw,remote:r' || 'local:rw,remote:rw' }}
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aria?schema=public
      REDIS_URL: redis://localhost:6379
      APP_TIME_ZONE: UTC
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Export DATABASE_URL
        run: echo "DATABASE_URL=${{ env.CI_DATABASE_URL }}" >> "$GITHUB_ENV"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            **/node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
          save-always: true

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('**/turbo.json', '**/bun.lock') }}
          restore-keys: |
            turbo-${{ runner.os }}-
          save-always: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply database migrations
        working-directory: apps/backend
        run: bun x --bun prisma migrate deploy

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Depreciation integration tests
        run: bun run test:integration

      - name: Typecheck
        run: bun run typecheck

      - name: Install Playwright browsers
        working-directory: apps/frontend
        run: bun run test:e2e:install

      - name: Test E2E
        run: bun run test:e2e

      - name: Build
        run: bun run build
