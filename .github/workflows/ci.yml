# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CI_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aria?schema=public

on:
  push:
    branches: ['main', 'master']
  pull_request:
    branches: ['main', 'master']

jobs:
  install-and-test:
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aria?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Export DATABASE_URL
        run: echo "DATABASE_URL=${{ env.CI_DATABASE_URL }}" >> "$GITHUB_ENV"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - name: Install dependencies
        run: bun ci

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build
