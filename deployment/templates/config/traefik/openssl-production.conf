# OpenSSL Configuration for Production SSL Certificate
# For path-based routing on static IP deployment
# 
# This template should be customized during installation to include:
# - All server IP addresses (IPv4 and IPv6)
# - Domain name (if assigned to IP)
#
# Usage:
#   openssl req -new -x509 -nodes \
#     -days 365 \
#     -keyout server.key \
#     -out server.crt \
#     -config openssl-production.conf

[req]
default_bits       = 4096
distinguished_name = req_distinguished_name
x509_extensions    = v3_req
prompt             = no

[req_distinguished_name]
C  = US
ST = State
L  = City
O  = Organization Name
OU = IT Department
CN = Aria ERP Server
emailAddress = admin@example.com

[v3_req]
keyUsage = critical, digitalSignature, keyEncipherment, keyAgreement
extendedKeyUsage = serverAuth, clientAuth
subjectAltName = @alt_names
basicConstraints = critical, CA:FALSE

[alt_names]
# DNS Names - Add your domain if available
DNS.1 = localhost
DNS.2 = aria.local

# IP Addresses - CUSTOMIZE THIS SECTION DURING INSTALLATION
# Add all IP addresses where the server will be accessible
# IPv4 Addresses
IP.1  = 127.0.0.1
IP.2  = 192.168.1.100
# Add more as needed:
# IP.3  = 192.168.1.101
# IP.4  = 10.0.0.50

# IPv6 Addresses (if applicable)
IP.10 = ::1
# Add more as needed:
# IP.11 = fe80::1
# IP.12 = 2001:db8::1

# INSTALLATION SCRIPT WILL:
# 1. Detect all network interfaces
# 2. Add all IP addresses to this configuration
# 3. Generate certificate valid for all IPs
# 4. This ensures access via any IP address works without certificate warnings
